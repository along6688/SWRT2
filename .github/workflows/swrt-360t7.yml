name: Build 360T7 25.12 Closed

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '设备 profile'
        required: true
        default: 'qihoo_360t7'
        type: choice
        options:
          - qihoo_360t7
          - qihoo_360t7_ubi
      ssh:
        description: '是否开启 tmate 调试'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  packages: write

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-25.12
  REPO_BRANCH: immortalwrt-25.12
  CONFIG_FILE: seed.config
  DIY_SH_1: diy-part1.sh
  DIY_SH_2: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v4

      - name: 清理磁盘空间
        uses: jlumbroso/free-disk-space@main
        continue-on-error: true
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex g++ gawk gcc-multilib gettext git \
            gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz lzip lzma \
            liblzma-dev mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge -y
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 拉取源码
        working-directory: /workdir
        run: |
          df -hT $PWD
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 应用 diy-part1
        run: |
          [ -f "$DIY_SH_1" ] && bash "$DIY_SH_1" "$GITHUB_WORKSPACE/openwrt" || true

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置
        run: |
          [ -e "$CONFIG_FILE" ] && cp -f "$CONFIG_FILE" openwrt/.config || true
          cd openwrt
          make defconfig

      - name: 应用 diy-part2
        run: |
          [ -f "$DIY_SH_2" ] && bash "$DIY_SH_2" "$GITHUB_WORKSPACE/openwrt" || true

      - name: 下载 dl 依赖
        id: package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 开始编译
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: 整理产物
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages *.buildinfo
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        with:
          tag_name: build-${{ env.FILE_DATE }}
          name: 360T7 ImmortalWrt 25.12 Closed ${{ env.FILE_DATE }}
          files: ${{ env.FIRMWARE }}/*

      - name: 开启调试
        if: failure() && github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
