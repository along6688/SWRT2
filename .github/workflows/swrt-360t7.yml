name: Build ImmortalWrt 25.12 360T7 闭源驱动
on:
  workflow_dispatch:
  push:
    branches: [ main ]
env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-25.12
  REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: configs/360t7-mtwifi.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_BIN_DIR: false
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialization environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison qemu-utils git gettext
      - name: Clone source
        run: |
          git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt
          cp ../${{ env.FEEDS_CONF }} feeds.conf.default
      - name: Feeds update & install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Load config
        run: |
          cd openwrt
          cp ../${{ env.CONFIG_FILE }} .config
          make defconfig
      - name: DIY Part1
        run: |
          chmod +x ${{ env.DIY_P1_SH }}
          ./${{ env.DIY_P1_SH }}
      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc)
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-25.12-mtwifi
          path: openwrt/bin/targets/mt798x/mt7981/
