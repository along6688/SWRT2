name: Build 360T7 ImmortalWrt
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          repository: chasey-dev/immortalwrt-mt798x-rebase
          path: openwrt
          fetch-depth: 0
          submodules: false

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget curl bzip2 flex bison ccache

      - name: 写入配置文件
        run: |
          echo 'CONFIG_TARGET_mediatek=y' > openwrt/.config
          echo 'CONFIG_TARGET_mediatek_filogic=y' >> openwrt/.config
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_360_t7=y' >> openwrt/.config
          echo 'CONFIG_TARGET_SUBTARGET="filogic"' >> openwrt/.config
          echo 'CONFIG_TARGET_PROFILE="DEVICE_360_t7"' >> openwrt/.config
          echo 'CONFIG_TARGET_BOARD="mediatek"' >> openwrt/.config
          echo 'CONFIG_TARGET_ROOTFS_PARTSIZE=1024' >> openwrt/.config
          echo 'CONFIG_TARGET_ROOTFS_TARGZ=y' >> openwrt/.config
          echo 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' >> openwrt/.config
          echo 'CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=256' >> openwrt/.config
          echo 'CONFIG_DEVEL=y' >> openwrt/.config
          echo 'CONFIG_TOOLCHAINOPTS=y' >> openwrt/.config
          echo 'CONFIG_BUSYBOX_CUSTOM=y' >> openwrt/.config
          echo 'CONFIG_BUSYBOX_CONFIG_FEATURE_IPV6=y' >> openwrt/.config
          echo 'CONFIG_BUSYBOX_CONFIG_FEATURE_PING6=y' >> openwrt/.config
          echo 'CONFIG_BUSYBOX_CONFIG_FEATURE_WGET_LONG_OPTIONS=y' >> openwrt/.config
          echo 'CONFIG_BUSYBOX_CONFIG_FEATURE_WGET_SSL=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-base=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-lib-base=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-lib-ip=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-lib-jsonc=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-lib-nixio=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-mod-admin-full=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-theme-bootstrap=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_adguardhome=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-app-adguardhome=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-app-eqos=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_dnsmasq-full=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_dropbear=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_openssl-util=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_wget-ssl=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_curl=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_iptables-nft=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_ip6tables-nft=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_nftables=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-nft-offload=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-mt7981=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-mt798x-firmware=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_wpad-wolfssl=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_hostapd=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_odhcpd=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_odhcp6c=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_odhcpd-ipv6only=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_ipv6helper=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_blockd=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-fs-ext4=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-fs-squashfs=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-usb-storage=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-usb2=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_kmod-usb3=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_bash=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_nano=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_htop=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_tcpdump=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_iperf3=y' >> openwrt/.config
          echo 'CONFIG_PACKAGE_jq=y' >> openwrt/.config
          echo 'CONFIG_SDK=n' >> openwrt/.config
          echo 'CONFIG_PACKAGE_ntpd=n' >> openwrt/.config
          echo 'CONFIG_PACKAGE_ddns-scripts=n' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-app-ddns=n' >> openwrt/.config
          echo 'CONFIG_PACKAGE_samba4=n' >> openwrt/.config
          echo 'CONFIG_PACKAGE_luci-app-samba4=n' >> openwrt/.config

      - name: 克隆第三方插件包（绕过feeds）
        run: |
          cd openwrt/package
          # 浅克隆插件仓库，失败自动重试
          git clone --depth=1 https://github.com/kenzok8/openwrt-packages.git kenzo || git clone --depth=1 https://github.com/kenzok8/openwrt-packages.git kenzo
          git clone --depth=1 https://github.com/kenzok8/small.git small || git clone --depth=1 https://github.com/kenzok8/small.git small
          # 验证目录
          ls -la kenzo
          ls -la small

      - name: 更新并安装官方 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a || ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置
        run: |
          cd openwrt
          make defconfig

      - name: 预下载源码
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-ImmortalWrt-AGH-EQOS
          path: openwrt/bin/targets/mediatek/filogic/
          retention-days: 7
