name: Build 360T7 ImmortalWrt
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          repository: chasey-dev/immortalwrt-mt798x-rebase
          ref: main
          path: openwrt
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget curl bzip2 flex bison ccache

      - name: 导入 .config 并添加插件源
        run: |
          cp -f $GITHUB_WORKSPACE/.config openwrt/.config
          cd openwrt
          sed -i '$a src-git kenzo https://github.com/kenzok8/openwrt-packages' feeds.conf.default
          sed -i '$a src-git small https://github.com/kenzok8/small' feeds.conf.default

      - name: 更新并安装 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置
        run: |
          cd openwrt
          make defconfig

      - name: 预下载源码
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-ImmortalWrt-AGH-EQOS
          path: openwrt/bin/targets/mediatek/filogic/
          retention-days: 7
