name: Build ImmortalWrt mt798x - 360T7 (auto track upstream)

# 用途：
#   每天定时检查上游 chasey-dev/immortalwrt-mt798x-rebase 的 25.12 分支有没有新提交，
#   有更新才编译 360T7 固件（内置 AdGuard Home + EQoS），没更新直接跳过、不烧 runner 时间。
#
# 用法：
#   1. 任意一个你自己的仓库（不需要 fork，空仓库只放这个文件也能跑）
#   2. 本文件放进 .github/workflows/ 并提交到默认分支
#   3. Actions 页面点一次 "Set up a workflow / Enable workflows"（新仓库不启用则 schedule 不触发）
#
# 注意：
#   - cron 用 UTC："0 1 * * *" = 北京时间 09:00；想一天两次改 "0 1,9 * * *"
#   - GitHub 对 fork 仓库的 schedule 有 60 天不活跃自动停用；自己的独立仓库不受此限制
#   - 只有编译成功才记录"已编到哪个上游 commit"，失败的话下次自动重试
#   - detect-update 这个 job 只跑十几秒，绝大多数无更新的日子就它一个人跑完收工

on:
  workflow_dispatch:
    inputs:
      device:
        description: "360T7 分区方案（不清楚就选 qihoo_360t7）"
        type: choice
        default: qihoo_360t7
        options:
          - qihoo_360t7
          - qihoo_360t7-ubi
      force_build:
        description: "Force build - 上游无更新也强制编译"
        type: boolean
        default: false
      enable_adguardhome:
        description: "内置 AdGuard Home（含 LuCI + 中文包）"
        type: boolean
        default: true
      enable_eqos:
        description: "内置 EQoS 流量限速（luci-app-eqos-mtk）"
        type: boolean
        default: true
      extra_packages:
        description: "额外插件，空格分隔（例：luci-app-ddns luci-app-ttyd）"
        required: false
        type: string
        default: ""
      upload_release:
        description: "同时发布 GitHub Release"
        type: boolean
        default: false
  schedule:
    # UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"

env:
  UPSTREAM: chasey-dev/immortalwrt-mt798x-rebase
  UPSTREAM_BRANCH: 25.12
  SRC_DIR: openwrt
  REPO_BASE_CONFIG: defconfig/mt7981-ax3000.config

concurrency:
  group: build-immortalwrt-360t7-auto
  cancel-in-progress: false

jobs:
  detect-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.latest.outputs.sha }}
      sha8: ${{ steps.latest.outputs.sha8 }}
    steps:
      - name: 读取上游最新 commit
        id: latest
        run: |
          set -e
          SHA=$(curl -sS --retry 3 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM/commits?sha=$UPSTREAM_BRANCH&per_page=1" \
            | jq -r '.[0].sha')
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::取不到上游 $UPSTREAM/$UPSTREAM_BRANCH 的最新 commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha8=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "上游最新：$UPSTREAM @ ${SHA:0:8} ($UPSTREAM_BRANCH)"

      - name: 恢复上次已编译 commit 记录
        uses: actions/cache@v4
        with:
          path: ci-state/
          key: ci-360t7-state-${{ github.run_id }}
          restore-keys: |
            ci-360t7-state-

      - name: 与上次编译结果比对
        id: cmp
        run: |
          PREV=""
          [ -f ci-state/last_built_sha ] && PREV=$(cat ci-state/last_built_sha)
          if [ "$PREV" = "$SHA" ] && [ "${{ github.event.inputs.force_build }}" != "true" ]; then
            echo "上游无新提交（上次已编 ${PREV:0:8}），本次跳过编译"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$PREV" ]; then
              echo "检测到更新：${PREV:0:8} -> ${SHA:0:8}"
            else
              echo "首次运行，全量编译"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SHA: ${{ steps.latest.outputs.sha }}

  build:
    needs: detect-update
    if: needs.detect-update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      DEVICE: ${{ github.event.inputs.device || 'qihoo_360t7' }}
      WITH_AGH: ${{ github.event.inputs.enable_adguardhome != 'false' }}
      WITH_EQOS: ${{ github.event.inputs.enable_eqos != 'false' }}
      EXTRA_PKGS: ${{ github.event.inputs.extra_packages }}
      UPSTREAM_SHA: ${{ needs.detect-update.outputs.sha }}
    defaults:
      run:
        working-directory: openwrt
    steps:
      - name: 释放磁盘空间
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          df -hT /

      - name: 安装编译依赖
        working-directory: .
        run: |
          sudo -E apt-get -o Acquire::Retries=3 update
          # 逐个校验包名：runner 镜像里不存在或改过名的包直接跳过，
          # 避免一个包名写错就把整轮编译拖挂
          PKGS="build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev libelf-dev python3-setuptools \
          python3-pyelftools rsync swig unzip zlib1g-dev file wget cmake time \
          ccache llvm dwarves device-tree-compiler"
          AVAIL=""
          for p in $PKGS; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              AVAIL="$AVAIL $p"
            else
              echo "::notice::跳过不存在的包：$p"
            fi
          done
          sudo -E DEBIAN_FRONTEND=noninteractive apt-get -y install $AVAIL
          sudo apt-get -qq autoremove --purge || true

      - name: 拉取上游最新源码
        working-directory: .
        run: |
          set -e
          git config --global --add safe.directory '*'
          # 只取 detect 阶段确认的那一个 commit，保证编的一定是最新源码
          git init -q "$SRC_DIR"
          git -C "$SRC_DIR" remote add origin "https://github.com/$UPSTREAM"
          git -C "$SRC_DIR" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$SRC_DIR" checkout -q -f FETCH_HEAD
          git -C "$SRC_DIR" log -1 --format='源码 commit：%h %ci %s'
          # 源码完整性自检，缺文件立刻报错，不要拖到后面报 No such file or directory
          for f in scripts/feeds "$REPO_BASE_CONFIG" target/linux/mediatek/image/filogic.mk; do
            test -e "$SRC_DIR/$f" || { echo "::error::源码异常，缺少 $f"; exit 1; }
          done
          grep -rqs "^define Device/${DEVICE}\$" "$SRC_DIR/target/linux/mediatek/image/" \
            || { echo "::error::上游没有机型 ${DEVICE}，当前可选："; \
                 grep -rhoE "qihoo_360t7[a-zA-Z0-9_.-]*" "$SRC_DIR/target/linux/mediatek/image/" | sort -u; exit 1; }

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config（360T7 + AdGuard Home + EQoS）
        run: |
          set -e
          rm -f .config
          cp -f "$REPO_BASE_CONFIG" .config

          # 基础配置里带了整机 mediatek 机型，清掉只留 360T7，省一大半编译时间
          sed -ri '/^CONFIG_TARGET_DEVICE(_PACKAGES)?_mediatek_filogic_DEVICE_/d' .config
          {
            echo "CONFIG_TARGET_MULTI_PROFILE=y"
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${DEVICE}=y"
          } >> .config

          if [ "$WITH_AGH" = "true" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y
          EOF
          fi

          # 想要社区通用版 EQoS：改成 luci-app-eqos / luci-i18n-eqos-zh-cn
          if [ "$WITH_EQOS" = "true" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci-app-eqos-mtk=y
          CONFIG_PACKAGE_luci-i18n-eqos-mtk-zh-cn=y
          EOF
          fi

          for pkg in $EXTRA_PKGS; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done

          make defconfig

          echo "==== 机型与插件确认 ===="
          grep -E "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_" .config || true
          for p in adguardhome luci-app-adguardhome luci-app-eqos-mtk; do
            grep -qs "^CONFIG_PACKAGE_${p}=y$" .config \
              || { echo "::error::插件 ${p} 未能选中（上游 feeds 依赖变动），本次编译中止"; exit 1; }
          done
          echo "OK：机型与插件检查通过"

      - name: 预下载源码包
        run: make -j$(nproc) defconfig download clean WERROR=0 || true

      - name: 编译固件
        run: make -j$(nproc) || make -j1 V=s

      - name: 整理固件文件
        run: |
          set -e
          mkdir -p out
          find bin/targets -maxdepth 3 -type f \( -name "*.itb" -o -name "*.bin" \
            -o -name "*.manifest" -o -name "*.buildinfo" -o -name "sha256sums" \) -exec cp -f {} out/ \;
          cp -f .config "out/config-360t7-$(date +%Y%m%d)"
          ( cd out && sha256sum * > SHA256SUMS.txt )
          ls -lh out

      - name: 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-360t7-${{ env.DEVICE }}-${{ needs.detect-update.outputs.sha8 }}
          path: openwrt/out/
          retention-days: 14
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 360t7-auto-${{ needs.detect-update.outputs.sha8 }}
          name: ImmortalWrt 360T7 auto r${{ github.run_number }}
          body: |
            上游 commit：${{ env.UPSTREAM_SHA }}
            机型：${{ env.DEVICE }} ｜ 插件：AdGuard Home + EQoS
          files: openwrt/out/*
          prerelease: true

      # 走到这里说明编译成功，才把"已编到哪个上游 commit"落盘（失败则下次自动重试）
      - name: 记录已编译的上游 commit
        working-directory: .
        run: |
          mkdir -p ci-state
          echo "$UPSTREAM_SHA" > ci-state/last_built_sha
          cat ci-state/last_built_sha

      - name: 保存状态缓存
        working-directory: .
        uses: actions/cache@v4
        with:
          path: ci-state/
          key: ci-360t7-state-${{ github.run_id }}
          restore-keys: |
            ci-360t7-state-
